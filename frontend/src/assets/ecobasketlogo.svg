<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 200"
    width="500"
    height="200"
    aria-labelledby="logoTitle"
    role="img"
>
    <title id="logoTitle">Eco Basket Logo</title>
    <circle 
        cx="100" 
        cy="100" 
        r="75" 
        fill="url(#gradientBg)"
    />
    <defs>
        <linearGradient id="gradientBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4A6049" />
            <stop offset="100%" stop-color="#88BDBC" />
        </linearGradient>
    </defs>
    <path 
        d="M100 50 C120 60, 130 90, 100 120 C70 90, 80 60, 100 50 Z" 
        fill="#D9B44A" 
        stroke="#353535"
        stroke-width="2"
    />
    <line
        x1="70"
        y1="100"
        x2="130"
        y2="100"
        stroke="#F9F7F1"
        stroke-width="4"
    />
    <line
        x1="75"
        y1="110"
        x2="125"
        y2="110"
        stroke="#F9F7F1"
        stroke-width="4"
    />
    <line
        x1="80"
        y1="120"
        x2="120"
        y2="120"
        stroke="#F9F7F1"
        stroke-width="4"
    />
    <text
        x="200"
        y="90"
        font-family="'Montserrat', sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#E07A5F"
        stroke="#353535"
        stroke-width="1"
    >
        Eco
    </text>
    <text
        x="200"
        y="140"
        font-family="'Montserrat', sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#E07A5F"
        stroke="#353535"
        stroke-width="1"
    >
        Basket
    </text>
    <path
        d="M200 145 Q300 190, 400 145"
        stroke="#D9B44A"
        stroke-width="4"
        fill="none"
    />
    <circle
        cx="400"
        cy="145"
        r="6"
        fill="#D9B44A"
    />
</svg>
