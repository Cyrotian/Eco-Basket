<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 300"
    width="500"
    height="300"
    aria-labelledby="illustrationTitle"
    role="img"
>
    <title id="illustrationTitle">Welcome to Eco Basket</title>
    <rect width="500" height="300" fill="url(#backgroundGradient)" />
    <defs>
        <linearGradient id="backgroundGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4A6049" />
            <stop offset="100%" stop-color="#88BDBC" />
        </linearGradient>
    </defs>
    <rect x="150" y="150" width="200" height="100" rx="20" ry="20" fill="#D9B44A" />
    <line x1="150" y1="150" x2="350" y2="150" stroke="#353535" stroke-width="2" />
    <line x1="180" y1="160" x2="180" y2="250" stroke="#353535" stroke-width="2" />
    <line x1="220" y1="160" x2="220" y2="250" stroke="#353535" stroke-width="2" />
    <line x1="260" y1="160" x2="260" y2="250" stroke="#353535" stroke-width="2" />
    <line x1="300" y1="160" x2="300" y2="250" stroke="#353535" stroke-width="2" />
    <circle cx="200" cy="130" r="20" fill="#E07A5F" />
    <circle cx="250" cy="120" r="30" fill="#FFD700" />
    <circle cx="300" cy="140" r="25" fill="#88BDBC" />
    <path d="M220 100 C230 90, 240 90, 250 100" stroke="#4A6049" stroke-width="3" fill="none" />
    <path d="M260 110 C270 100, 280 100, 290 110" stroke="#4A6049" stroke-width="3" fill="none" />
    <text
        x="250"
        y="50"
        font-family="'Montserrat', sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#F9F7F1"
        text-anchor="middle"
    >
        Welcome to Eco Basket
    </text>
    <text
        x="250"
        y="80"
        font-family="'Montserrat', sans-serif"
        font-size="16"
        fill="#F9F7F1"
        text-anchor="middle"
    >
        Join the organic community today!
    </text>
</svg>
